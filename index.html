<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Pengguna - Offline Ready</title>
    <link rel="manifest" href="manifest.json">
    <style>
        /* ... (CSS sama persis seperti kode sebelumnya) ... */
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f4f6f9; margin: 20px; }
        .container { display: flex; gap: 20px; flex-wrap: wrap; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex: 1; min-width: 300px; }
        .card-table { flex: 2; min-width: 500px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; flex: 1; }
        .btn-add { background-color: #2ecc71; color: white; }
        .btn-update { background-color: #3498db; color: white; }
        .btn-delete { background-color: #e74c3c; color: white; }
        .btn-clear { background-color: #95a5a6; color: white; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 12px; }
        th { background-color: #34495e; color: white; }
        tr:hover { background-color: #f1f2f6; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Manajemen Pengguna (PWA Offline)</h2>

    <div class="container">
        <div class="card">
            <h3>Form Pengguna</h3>
            <form id="userForm">
                <div class="form-group"><label>ID</label><input type="text" id="id" required></div>
                <div class="form-group"><label>Nama</label><input type="text" id="nama" required></div>
                <div class="form-group"><label>Sandi</label><input type="password" id="sandi" required></div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="status" required>
                        <option value="Aktif">Aktif</option>
                        <option value="Tidak Aktif">Tidak Aktif</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button type="button" class="btn-add" id="btnCreate" onclick="addData()">Simpan</button>
                    <button type="button" class="btn-update" id="btnUpdate" onclick="updateData()" style="display:none;">Ubah</button>
                    <button type="button" class="btn-delete" id="btnDelete" onclick="deleteData()" style="display:none;">Hapus</button>
                    <button type="button" class="btn-clear" onclick="resetForm()">Batal</button>
                </div>
            </form>
        </div>

        <div class="card card-table">
            <h3>Daftar Pengguna</h3>
            <table id="userTable">
                <thead id="tableHead"></tbody>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // --- LOGIK INDEXTEDDB (Sama seperti kemarin) ---
        const dbName = "AplikasiLoginDB";
        const dbVersion = 1;
        const storeName = "pengguna";
        let db;

        const request = indexedDB.open(dbName, dbVersion);
        request.onupgradeneeded = e => {
            db = e.target.result;
            if (!db.objectStoreNames.contains(storeName)) db.createObjectStore(storeName, { keyPath: "id" });
        };
        request.onsuccess = e => { db = e.target.result; renderTable(); };
        
        function getObjectStore(mode) { return db.transaction(storeName, mode).objectStore(storeName); }

        function addData() {
            const id = document.getElementById('id').value.trim();
            const nama = document.getElementById('nama').value.trim();
            const sandi = document.getElementById('sandi').value;
            const status = document.getElementById('status').value;
            if(!id || !nama || !sandi) return alert("Isi semua data!");
            
            const request = getObjectStore("readwrite").add({ id, nama, sandi, status });
            request.onsuccess = () => { alert("Data ditambah!"); resetForm(); renderTable(); };
        }

        function updateData() {
            const data = { id: document.getElementById('id').value, nama: document.getElementById('nama').value, sandi: document.getElementById('sandi').value, status: document.getElementById('status').value };
            getObjectStore("readwrite").put(data).onsuccess = () => { alert("Data diubah!"); resetForm(); renderTable(); };
        }

        function deleteData() {
            const id = document.getElementById('id').value;
            if(confirm("Hapus data?")) { getObjectStore("readwrite").delete(id).onsuccess = () => { alert("Data dihapus!"); resetForm(); renderTable(); }; }
        }

        function renderTable() {
            getObjectStore("readonly").getAll().onsuccess = e => {
                const listData = e.target.result;
                const thead = document.getElementById('tableHead');
                const tbody = document.getElementById('tableBody');
                thead.innerHTML = ""; tbody.innerHTML = "";
                if (listData.length === 0) { thead.innerHTML = "<tr><th>Kosong</th></tr>"; return; }
                
                const columns = Object.keys(listData[0]);
                let headRow = "<tr>"; columns.forEach(col => headRow += `<th>${col.toUpperCase()}</th>`); thead.innerHTML = headRow + "</tr>";

                listData.forEach(item => {
                    let bodyRow = document.createElement('tr');
                    columns.forEach(col => {
                        let td = document.createElement('td');
                        td.textContent = (col === 'sandi') ? '••••' : item[col];
                        bodyRow.appendChild(td);
                    });
                    bodyRow.onclick = () => fillForm(item);
                    tbody.appendChild(bodyRow);
                });
            };
        }

        function fillForm(data) {
            document.getElementById('id').value = data.id; document.getElementById('id').disabled = true;
            document.getElementById('nama').value = data.nama; document.getElementById('sandi').value = data.sandi; document.getElementById('status').value = data.status;
            document.getElementById('btnCreate').style.display = "none"; document.getElementById('btnUpdate').style.display = "inline-block"; document.getElementById('btnDelete').style.display = "inline-block";
        }

        function resetForm() {
            document.getElementById('userForm').reset(); document.getElementById('id').disabled = false;
            document.getElementById('btnCreate').style.display = "inline-block"; document.getElementById('btnUpdate').style.display = "none"; document.getElementById('btnDelete').style.display = "none";
        }

        // --- PROSES DAFTAR SERVICE WORKER AGAR BISA OFFLINE ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker terdaftar!', reg))
                    .catch(err => console.error('Gagal daftar Service Worker', err));
            });
        }
    </script>
</body>
</html>
